<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>伏見ガク 配信ガチャ</title>

<style>
body {
  margin: 0;
  font-family: sans-serif;
  background: radial-gradient(circle at top, #3b1e6d, #0d0d1a);
  color: white;
  text-align: center;
  padding: 20px;
}

h1 {
  font-size: 30px;
  margin-bottom: 5px;
}

button {
  background: linear-gradient(45deg, #ff9800, #ff5722);
  border: none;
  padding: 16px 32px;
  font-size: 20px;
  border-radius: 40px;
  cursor: pointer;
  transition: 0.2s;
  box-shadow: 0 0 25px rgba(255, 87, 34, 0.8);
}

button:active {
  transform: scale(0.95);
}

#loading {
  margin-top: 15px;
  font-size: 18px;
  opacity: 0.8;
}


#video-wrapper {
  margin-top: 25px;
  border-radius: 15px;
  overflow: hidden;
  box-shadow: 0 0 30px rgba(0,0,0,0.6);
}
  
#video-wrapper iframe {
  position: absolute;
  width: 100%;
  height: 100%;
  left: 0;
  top: 0;
}

.badge {
  display: inline-block;
  padding: 8px 16px;
  margin: 5px;
  border-radius: 25px;
  background: rgba(255,255,255,0.15);
  font-size: 14px;
}
</style>
</head>

<body>

<h1>🎰 伏見ガク 配信ガチャ</h1>
<button onclick="drawRandom()">ガチャを回す</button>

<div id="loading"></div>
<div id="video-wrapper"></div>
<div id="meta"></div>

<script>

let videos = [];

async function loadSheet() {
  const url = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQNZRFV7f6MbC5-ZOvVy8VHofG1H9_0PGQbbaYi-nLOBVr3F-Roz47rPnvAU5yEWmfcEHODMT9-EMsV/pub?gid=0&single=true&output=csv";

  const response = await fetch(url);
  const text = await response.text();

  const rows = text.split("\n").slice(1);

  videos = rows
    .filter(row => row.trim() !== "")
    .map(row => {
      const cols = row.split(",");

      const videoUrl = cols[0];
      const videoId = videoUrl.split("v=")[1]?.split("&")[0];

      return {
        id: videoId,
        date: cols[1],
        outfit: cols[2],
        hairstyle: cols[3],
        mode: cols[4],
        genre: cols[5]
      };
    });
}

loadSheet();


let lastVideoId = null;

function drawRandom() {
  
if (videos.length === 0) {
  alert("データ読み込み中です");
  return;
}
  document.getElementById("loading").innerText = "ガチャ回転中…";

  setTimeout(() => {

    let randomVideo;
    do {
      randomVideo = videos[Math.floor(Math.random() * videos.length)];
    } while (videos.length > 1 && randomVideo.id === lastVideoId);

    lastVideoId = randomVideo.id;

    document.getElementById("loading").innerText =
      "✨ 今日の伏見ガクはこれ！";

    document.getElementById("video-wrapper").innerHTML =
      `<iframe src="https://www.youtube.com/embed/${randomVideo.id}"
       frameborder="0" allowfullscreen></iframe>`;

    document.getElementById("meta").innerHTML =
      `<div class="badge">🎮 ${randomVideo.genre}</div>
       <div class="badge">🎽 ${randomVideo.outfit}</div>
       <div style="margin-top:8px;">💬 ${randomVideo.comment}</div>`;

  }, 700); // 演出の間

}
</script>

</body>
</html>
